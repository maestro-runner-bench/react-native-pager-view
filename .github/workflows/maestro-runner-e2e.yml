name: maestro-runner e2e

# Builds the example app as ios.yml / android.yml do, then runs the Maestro
# flows (.maestro/) on it with maestro-runner. See scripts/ci/run-maestro-runner.sh.

on:
  push:
    branches: [maestro-runner-e2e]
  workflow_dispatch:

env:
  MAESTRO_RUNNER_VERSION: 1.1.28.2

jobs:
  e2e-ios:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install dependencies
        run: bun install

      - name: Install example dependencies
        run: bun install
        working-directory: example

      - name: Cache Pods
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: example/ios/Pods
          key: ${{ hashFiles('example/ios/Podfile.lock') }}

      - name: Bundle app
        run: bun build:ios
        working-directory: example

      - name: Install example Pods
        run: bun pods
        working-directory: example

      # Builds the Release app and installs and launches it on a simulator.
      - name: Build iOS App
        run: bun example:ios:release

      - name: Install maestro-runner
        run: curl -fsSL https://open.devicelab.dev/install/maestro-runner | bash -s -- --version "$MAESTRO_RUNNER_VERSION"

      - name: Run e2e tests
        run: scripts/ci/run-maestro-runner.sh ios

      - name: Upload test artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-ios-artifacts
          if-no-files-found: warn
          path: reports/

  e2e-android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install dependencies
        run: bun install

      - name: Install example dependencies
        run: bun install
        working-directory: example

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Bundle app
        run: bun run build:android
        working-directory: example

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install maestro-runner
        run: curl -fsSL https://open.devicelab.dev/install/maestro-runner | bash -s -- --version "$MAESTRO_RUNNER_VERSION"

      # The emulator from android.yml; the Release app is built and installed
      # on it, then the flows run.
      - name: Build and run e2e tests
        uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed # v2.34.0
        with:
          api-level: 35
          arch: x86_64
          ram-size: 4096M
          profile: pixel
          avd-name: Pixel_3a_API_30_AOSP
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          emulator-boot-timeout: 12000
          disable-animations: false
          script: |
            bun example:android:release
            scripts/ci/run-maestro-runner.sh android emulator-5554

      - name: Upload test artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-android-artifacts
          if-no-files-found: warn
          path: reports/
